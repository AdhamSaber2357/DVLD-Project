<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg{fill:#edf5ff}.table{fill:#fff;stroke:#222;stroke-width:2}.head{fill:#dceeff}.line{stroke:#222;stroke-width:1.6}.t{font-family:Arial,sans-serif;fill:#171717}.title{font-size:23px;font-weight:700;letter-spacing:.5px}.cell{font-size:17px}.small{font-size:13px;fill:#475569}.pk{text-decoration:underline;font-weight:700}.fk{fill:#0b65b0;font-weight:700}.arrow{stroke:#1693e8;stroke-width:2.5;fill:none;marker-end:url(#a)}.legend{font-size:15px;fill:#334155}.note{font-size:14px;fill:#334155}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1693e8"/></marker>
  </defs>
  <rect width="1600" height="1050" fill="#f8fbff"/>
  <rect x="38" y="30" width="1524" height="78" rx="7" class="bg"/>
  <text x="70" y="68" class="t" style="font-size:29px;font-weight:700">University Course Management System - Relational Mapping</text>
  <text x="70" y="93" class="small">Participation applied: total participation = NOT NULL FK; partial participation = nullable FK or no row required.</text>

  <!-- TOPIC -->
  <text x="100" y="165" class="t title">TOPIC</text><rect x="100" y="176" width="290" height="74" class="table"/><line x1="100" y1="213" x2="390" y2="213" class="line"/>
  <text x="120" y="201" class="t cell pk">TID</text><text x="245" y="201" class="t cell">TName</text>
  <!-- COURSE -->
  <text x="535" y="165" class="t title">COURSE</text><rect x="535" y="176" width="650" height="74" class="table"/><line x1="650" y1="176" x2="650" y2="250" class="line"/><line x1="790" y1="176" x2="790" y2="250" class="line"/><line x1="925" y1="176" x2="925" y2="250" class="line"/><line x1="1050" y1="176" x2="1050" y2="250" class="line"/>
  <text x="553" y="206" class="t cell pk">CID</text><text x="672" y="206" class="t cell">CName</text><text x="807" y="206" class="t cell">Duration</text><text x="940" y="206" class="t cell">Description</text><text x="1068" y="197" class="t cell fk">TID FK</text><text x="1068" y="219" class="small">NOT NULL</text>
  <path d="M390 213 C450 213 460 195 530 195" class="arrow"/><text x="420" y="190" class="note">1 : M</text>

  <!-- DEPARTMENT -->
  <text x="100" y="355" class="t title">DEPARTMENT</text><rect x="100" y="366" width="315" height="74" class="table"/><line x1="100" y1="403" x2="415" y2="403" class="line"/>
  <text x="120" y="391" class="t cell pk">DID</text><text x="265" y="391" class="t cell">DName</text>
  <!-- STUDENT -->
  <text x="535" y="335" class="t title">STUDENT</text><rect x="535" y="346" width="920" height="113" class="table"/>
  <line x1="535" y1="383" x2="1455" y2="383" class="line"/><line x1="535" y1="421" x2="1455" y2="421" class="line"/>
  <line x1="650" y1="346" x2="650" y2="421" class="line"/><line x1="785" y1="346" x2="785" y2="421" class="line"/><line x1="925" y1="346" x2="925" y2="421" class="line"/><line x1="1050" y1="346" x2="1050" y2="459" class="line"/><line x1="1215" y1="346" x2="1215" y2="459" class="line"/>
  <text x="552" y="374" class="t cell pk">SID</text><text x="668" y="374" class="t cell">FName</text><text x="804" y="374" class="t cell">LName</text><text x="942" y="374" class="t cell">Age</text><text x="1065" y="374" class="t cell">Address</text><text x="1231" y="374" class="t cell fk">DID FK</text>
  <text x="552" y="411" class="small">SName is composite → FName + LName</text><text x="1231" y="411" class="small">NOT NULL (Located In: total)</text><text x="1070" y="446" class="t cell fk">SupervisorSID FK</text><text x="1250" y="446" class="small">NULL (Super: partial)</text>
  <path d="M415 403 C455 403 470 365 530 365" class="arrow"/><text x="440" y="348" class="note">1 : M</text>

  <!-- INSTRUCTOR -->
  <text x="535" y="555" class="t title">INSTRUCTOR</text><rect x="535" y="566" width="920" height="74" class="table"/>
  <line x1="645" y1="566" x2="645" y2="640" class="line"/><line x1="775" y1="566" x2="775" y2="640" class="line"/><line x1="890" y1="566" x2="890" y2="640" class="line"/><line x1="1000" y1="566" x2="1000" y2="640" class="line"/><line x1="1135" y1="566" x2="1135" y2="640" class="line"/><line x1="1270" y1="566" x2="1270" y2="640" class="line"/>
  <text x="550" y="596" class="t cell pk">InsID</text><text x="660" y="596" class="t cell">InsName</text><text x="790" y="596" class="t cell">Salary</text><text x="905" y="596" class="t cell">Bonus</text><text x="1015" y="596" class="t cell">Address</text><text x="1150" y="596" class="t cell">Hour_Rate</text><text x="1285" y="587" class="t cell fk">DID FK</text><text x="1285" y="610" class="small">NOT NULL</text>
  <path d="M415 403 C480 403 480 584 530 584" class="arrow"/><text x="443" y="510" class="note">1 : M</text>

  <!-- TAKE -->
  <text x="100" y="745" class="t title">TAKE</text><rect x="100" y="756" width="455" height="74" class="table"/><line x1="250" y1="756" x2="250" y2="830" class="line"/><line x1="400" y1="756" x2="400" y2="830" class="line"/>
  <text x="118" y="786" class="t cell pk fk">SID FK</text><text x="267" y="786" class="t cell pk fk">CID FK</text><text x="417" y="786" class="t cell">Grade</text><text x="120" y="817" class="small">PK = (SID, CID)  |  M:N relationship</text>
  <!-- TEACH -->
  <text x="710" y="745" class="t title">TEACH</text><rect x="710" y="756" width="480" height="74" class="table"/><line x1="870" y1="756" x2="870" y2="830" class="line"/><line x1="1020" y1="756" x2="1020" y2="830" class="line"/>
  <text x="728" y="786" class="t cell pk fk">InsID FK</text><text x="887" y="786" class="t cell pk fk">CID FK</text><text x="1038" y="786" class="t cell">Evaluation</text><text x="728" y="817" class="small">PK = (InsID, CID)  |  M:N relationship</text>

  <!-- MANAGE -->
  <text x="100" y="930" class="t title">MANAGE</text><rect x="100" y="941" width="610" height="74" class="table"/><line x1="295" y1="941" x2="295" y2="1015" class="line"/><line x1="500" y1="941" x2="500" y2="1015" class="line"/>
  <text x="118" y="971" class="t cell pk fk">DID FK</text><text x="315" y="962" class="t cell fk">InsID FK</text><text x="315" y="984" class="small">UNIQUE</text><text x="520" y="971" class="t cell">HireDate</text>
  <text x="735" y="962" class="legend">1:1 relationship</text><text x="735" y="984" class="legend">DID is PK → one manager per department</text><text x="735" y="1005" class="legend">InsID UNIQUE → one department per instructor</text>

  <rect x="1200" y="745" width="300" height="170" rx="6" fill="#edf7ff" stroke="#9cccf2"/>
  <text x="1220" y="778" class="t title" style="font-size:18px">Legend</text>
  <text x="1220" y="810" class="legend"><tspan class="pk">Underlined</tspan> = Primary Key</text>
  <text x="1220" y="838" class="legend" fill="#0b65b0">Blue = Foreign Key</text>
  <text x="1220" y="866" class="legend">NOT NULL = Total participation</text>
  <text x="1220" y="894" class="legend">NULL = Partial participation</text>
</svg>
